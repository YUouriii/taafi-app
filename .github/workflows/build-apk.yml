name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional but recommended: same signing key on every CI build.
      # Store your debug keystore base64-encoded as DEBUG_KEYSTORE_B64:
      #   [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\.android\debug.keystore"))
      # - name: Restore debug keystore
      #   env:
      #     DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
      #   run: |
      #     mkdir -p ~/.android
      #     echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BreakFree.apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/BreakFree.apk
          generate_release_notes: true

      # Tell the website to rebuild so it picks up this release: the site
      # fetches the latest APK and shows the new version number. Create the
      # hook in Netlify (Site configuration â†’ Build & deploy â†’ Build hooks)
      # and store its URL here as the NETLIFY_BUILD_HOOK secret.
      - name: Rebuild the website
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            curl -sS -X POST "$NETLIFY_BUILD_HOOK" -o /dev/null \
              -w "Website rebuild requested (HTTP %{http_code})\n"
          else
            echo "NETLIFY_BUILD_HOOK is not set â€” skipping the website rebuild."
          fi
